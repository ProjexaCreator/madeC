<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Cable POS v5.3 - Auto Discount</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
    }
    body {
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      background: #e9edf2;
      padding: 20px;
    }
    header {
      background: linear-gradient(135deg, #0b5ed7, #0a4ca0);
      color: #fff;
      padding: 18px 24px;
      border-radius: 12px 12px 0 0;
      font-size: 26px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    header small {
      font-size: 14px;
      font-weight: 400;
      opacity: 0.85;
    }
    .wrap {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      background: #fff;
      padding: 20px;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    .card {
      background: #f8fafc;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }
    .card h3 {
      margin-top: 0;
      margin-bottom: 16px;
      color: #0b5ed7;
      font-size: 18px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 18px;
    }
    .grid label {
      font-weight: 600;
      font-size: 13px;
      color: #1e293b;
      display: block;
      margin-bottom: 4px;
    }
    .grid input, .grid select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
      transition: 0.2s;
    }
    .grid input:focus, .grid select:focus {
      border-color: #0b5ed7;
      outline: none;
      box-shadow: 0 0 0 3px rgba(11,94,215,0.15);
    }
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 18px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: 0.15s;
      background: #e2e8f0;
      color: #1e293b;
    }
    .btn-primary {
      background: #0b5ed7;
      color: #fff;
    }
    .btn-primary:hover {
      background: #094ba8;
    }
    .btn-success {
      background: #16a34a;
      color: #fff;
    }
    .btn-success:hover {
      background: #15803d;
    }
    .btn-danger {
      background: #dc2626;
      color: #fff;
    }
    .btn-danger:hover {
      background: #b91c1c;
    }
    .summary .row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px dashed #d1d9e6;
      font-size: 15px;
    }
    .summary .row:last-child {
      border-bottom: none;
    }
    .total {
      font-size: 22px;
      font-weight: 700;
      color: #0b5ed7;
      background: #e6f0ff;
      padding: 10px 14px;
      border-radius: 8px;
      margin-top: 6px;
    }
    .total b {
      font-size: 26px;
      color: #0b5ed7;
    }
    .discount-section {
      background: #f0fdf4;
      border: 2px solid #86efac;
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
    }
    .discount-section .label {
      font-weight: 600;
      font-size: 14px;
      color: #166534;
      margin-bottom: 8px;
      display: block;
    }
    .discount-badge {
      display: inline-block;
      background: #16a34a;
      color: #fff;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
    }
    .discount-info {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      padding: 8px 12px;
      background: #fff;
      border-radius: 6px;
      border: 1px solid #86efac;
      flex-wrap: wrap;
      gap: 6px;
    }
    .discount-info span {
      font-weight: 600;
    }
    .discount-info .saved {
      color: #16a34a;
    }
    .discount-tier {
      font-size: 12px;
      color: #166534;
      background: #dcfce7;
      padding: 4px 12px;
      border-radius: 12px;
      display: inline-block;
    }
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }
    .settings-grid input {
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
      width: 100%;
    }
    .settings-grid label {
      font-size: 12px;
      font-weight: 600;
      color: #334155;
    }
    .settings-group {
      margin-top: 12px;
    }
    .settings-group label {
      font-weight: 600;
      font-size: 13px;
      display: block;
      margin: 6px 0 2px;
    }
    .toast {
      background: #16a34a;
      color: #fff;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 13px;
      display: inline-block;
      animation: fadeOut 2s forwards;
    }
    @keyframes fadeOut {
      0% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; }
    }
    .tier-info {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 6px 0 2px;
    }
    .tier-info .tier {
      font-size: 11px;
      background: #e2e8f0;
      padding: 2px 10px;
      border-radius: 10px;
      color: #475569;
    }
    .tier-info .tier.active-tier {
      background: #16a34a;
      color: #fff;
      font-weight: 700;
    }
    @media (max-width: 800px) {
      .wrap { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
      .settings-grid { grid-template-columns: 1fr 1fr; }
    }
    @media print {
      body { background: #fff; padding: 10px; }
      .wrap { box-shadow: none; border: 1px solid #ccc; }
      .btn, .btn-group { display: none; }
      header { background: #0b5ed7 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .total { background: #e6f0ff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

<header>
  <span>🎤 Audio Cable POS v5.3</span>
  <small>Auto Material Discount</small>
</header>

<div class="wrap">
  <!-- LEFT: INPUTS -->
  <div class="card">
    <div class="grid">
      <div><label>Customer</label><input id="cust" placeholder="Walk-in / Name"></div>
      <div><label>Date</label><input type="date" id="dt"></div>
      <div><label>Cable Type</label>
        <select id="type">
          <option value="xlrp">XLR F→M (Plastic)</option>
          <option value="xlrn">XLR F→M (No Plastic)</option>
          <option value="pls">PL Stereo → PL Stereo (Balanced)</option>
          <option value="plm">PL Mono → PL Mono</option>
        </select>
      </div>
      <div><label>Length (meters)</label><input id="meters" type="number" value="10" min="0.5" step="0.5"></div>
      <div><label>Connector Qty A</label><input id="qa" type="number" value="2" min="0"></div>
      <div><label>Connector Qty B</label><input id="qb" type="number" value="2" min="0"></div>
      <div><label>Sets (pcs)</label><input id="sets" type="number" value="1" min="1"></div>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="window.print()">🖨️ Print</button>
      <button class="btn btn-success" onclick="resetToDefault()">↺ Reset Defaults</button>
    </div>
  </div>

  <!-- RIGHT: SUMMARY + DISCOUNT + SETTINGS -->
  <div>
    <div class="card summary">
      <h3>📋 Summary</h3>
      <div class="row"><span>Cable Cost</span><b id="rc">₱0.00</b></div>
      <div class="row"><span>Connector A</span><b id="ra">₱0.00</b></div>
      <div class="row"><span>Connector B</span><b id="rb">₱0.00</b></div>
      <div class="row" style="border-bottom:2px solid #d1d9e6;padding-bottom:12px;">
        <span style="font-weight:700;">Subtotal (Materials)</span>
        <b id="subtotal" style="font-size:18px;">₱0.00</b>
      </div>
      
      <!-- DISCOUNT SECTION - AUTO -->
      <div class="discount-section">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
          <span class="label" style="margin:0;">🏷️ Auto Material Discount</span>
          <span class="discount-tier" id="tierLabel">No discount</span>
        </div>
        
        <!-- Tier indicators -->
        <div class="tier-info">
          <span class="tier" data-tier="0">0%</span>
          <span class="tier" data-tier="3">3%</span>
          <span class="tier" data-tier="5">5%</span>
          <span class="tier" data-tier="8">8%</span>
          <span class="tier" data-tier="10">10%</span>
        </div>
        
        <div class="discount-info">
          <span>Discount: <b id="discountLabel">0%</b></span>
          <span class="saved">You Saved: <b id="savedAmount">₱0.00</b></span>
        </div>
      </div>

      <div class="row"><span>Labor</span><b id="rl">₱0.00</b></div>
      <div class="row total">
        <span>TOTAL (incl. Labor)</span>
        <b id="gt">₱0.00</b>
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <h3>⚙️ Price Settings</h3>
      <div class="settings-group">
        <label>Cable (per meter)</label>
        <input id="pc" type="number" step="1" value="168">
      </div>

      <div class="settings-group">
        <label>XLR Connectors</label>
        <div class="settings-grid">
          <div><label>NC3MXX</label><input id="nc3m" type="number" step="1" value="250"></div>
          <div><label>NC3FXX</label><input id="nc3f" type="number" step="1" value="275"></div>
          <div><label>NC3MXX‑D</label><input id="nc3md" type="number" step="1" value="230"></div>
          <div><label>NC3FXX‑D</label><input id="nc3fd" type="number" step="1" value="255"></div>
        </div>
      </div>

      <div class="settings-group">
        <label>PL Connectors</label>
        <div class="settings-grid">
          <div><label>NP3X (Stereo)</label><input id="np3x" type="number" step="1" value="360"></div>
          <div><label>NP2X (Mono)</label><input id="np2x" type="number" step="1" value="240"></div>
        </div>
      </div>

      <div class="settings-group">
        <label>Labor (per set)</label>
        <input id="labor" type="number" step="1" value="300" style="max-width:140px;">
      </div>

      <div class="btn-group" style="margin-top:14px;">
        <button class="btn btn-primary" onclick="saveSettings()">💾 Save Settings</button>
        <span id="saveToast" style="margin-left:10px;"></span>
      </div>
    </div>
  </div>
</div>

<script>
  // === Default price data ===
  const DEFAULTS = {
    c: 168,
    nc3m: 250,
    nc3f: 275,
    nc3md: 230,
    nc3fd: 255,
    np3x: 360,
    np2x: 240,
    l: 300
  };

  // === Discount Brackets ===
  const DISCOUNT_BRACKETS = [
    { min: 0, max: 2999, rate: 0 },
    { min: 3000, max: 7999, rate: 3 },
    { min: 8000, max: 15999, rate: 5 },
    { min: 16000, max: 24999, rate: 8 },
    { min: 25000, max: Infinity, rate: 10 }
  ];

  // Load from localStorage or use defaults
  let d = { ...DEFAULTS };
  try {
    const saved = JSON.parse(localStorage.getItem('v5'));
    if (saved && typeof saved === 'object') {
      for (let key of Object.keys(DEFAULTS)) {
        if (saved[key] !== undefined && !isNaN(saved[key])) {
          d[key] = Number(saved[key]);
        }
      }
    }
  } catch (_) {}

  // === DOM refs ===
  const $ = id => document.getElementById(id);
  const fields = ['pc','nc3m','nc3f','nc3md','nc3fd','np3x','np2x','labor'];
  const inputFields = fields.map(id => $(id));

  // Format currency (PHP)
  function p(val) {
    const num = Number(val) || 0;
    return '₱' + num.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  // Get discount rate based on subtotal
  function getDiscountRate(subtotal) {
    for (let bracket of DISCOUNT_BRACKETS) {
      if (subtotal >= bracket.min && subtotal <= bracket.max) {
        return bracket.rate;
      }
    }
    return 0;
  }

  // Calculate and update summary
  function calc() {
    const meters = parseFloat($('meters').value) || 0;
    const sets = parseInt($('sets').value) || 1;
    const qa = parseInt($('qa').value) || 0;
    const qb = parseInt($('qb').value) || 0;
    const type = $('type').value;

    // Cable cost
    const cp = d.c * meters * sets;

    // Connector costs based on type
    let aPrice = 0, bPrice = 0;
    switch (type) {
      case 'xlrp':
        aPrice = d.nc3m;
        bPrice = d.nc3f;
        break;
      case 'xlrn':
        aPrice = d.nc3md;
        bPrice = d.nc3fd;
        break;
      case 'pls':
        aPrice = d.np3x;
        bPrice = d.np3x;
        break;
      case 'plm':
        aPrice = d.np2x;
        bPrice = d.np2x;
        break;
    }
    const aTotal = aPrice * qa;
    const bTotal = bPrice * qb;
    const materialsTotal = cp + aTotal + bTotal;

    // === AUTO DISCOUNT based on materials subtotal ===
    const discountRate = getDiscountRate(materialsTotal);
    const discountMultiplier = 1 - (discountRate / 100);
    const discountedMaterials = materialsTotal * discountMultiplier;
    const discountAmount = materialsTotal - discountedMaterials;

    const laborTotal = d.l * sets;
    const grand = discountedMaterials + laborTotal;

    // Update display
    $('rc').textContent = p(cp);
    $('ra').textContent = p(aTotal);
    $('rb').textContent = p(bTotal);
    $('subtotal').textContent = p(materialsTotal);
    $('rl').textContent = p(laborTotal);
    $('gt').textContent = p(grand);

    // Update discount info
    if (discountRate > 0) {
      $('discountLabel').textContent = discountRate + '%';
      $('savedAmount').textContent = p(discountAmount);
      $('savedAmount').style.color = '#16a34a';
      
      // Tier label
      let tierText = '';
      for (let b of DISCOUNT_BRACKETS) {
        if (b.rate === discountRate) {
          tierText = b.rate + '% discount';
          if (b.max === Infinity) {
            tierText += ' (₱25,000+)';
          } else {
            tierText += ' (₱' + b.min.toLocaleString() + ' - ₱' + b.max.toLocaleString() + ')';
          }
          break;
        }
      }
      $('tierLabel').textContent = '🏷️ ' + tierText;
      $('tierLabel').style.background = '#86efac';
    } else {
      $('discountLabel').textContent = '0%';
      $('savedAmount').textContent = '₱0.00';
      $('savedAmount').style.color = '#64748b';
      $('tierLabel').textContent = 'No discount applied';
      $('tierLabel').style.background = '#e2e8f0';
    }

    // Update tier indicators
    document.querySelectorAll('.tier-info .tier').forEach(el => {
      const tierRate = parseInt(el.dataset.tier);
      if (tierRate === discountRate && discountRate > 0) {
        el.classList.add('active-tier');
      } else {
        el.classList.remove('active-tier');
      }
    });
  }

  // Populate settings fields from `d` and run calc
  function populateSettings() {
    fields.forEach(id => {
      const key = id === 'labor' ? 'l' : id;
      if (d[key] !== undefined) {
        $(id).value = d[key];
      }
    });
    calc();
  }

  // Save settings from UI to `d` and localStorage
  function saveSettings() {
    const newData = {};
    fields.forEach(id => {
      const key = id === 'labor' ? 'l' : id;
      const val = parseFloat($(id).value);
      if (!isNaN(val) && val >= 0) {
        newData[key] = val;
      } else {
        newData[key] = DEFAULTS[key] || 0;
        $(id).value = newData[key];
      }
    });
    for (let key of Object.keys(DEFAULTS)) {
      if (newData[key] === undefined) newData[key] = DEFAULTS[key];
    }
    d = newData;
    localStorage.setItem('v5', JSON.stringify(d));

    const toast = $('saveToast');
    toast.textContent = '✅ Saved!';
    toast.className = 'toast';
    setTimeout(() => { toast.textContent = ''; toast.className = ''; }, 2000);

    calc();
  }

  // Reset to factory defaults
  function resetToDefault() {
    d = { ...DEFAULTS };
    localStorage.setItem('v5', JSON.stringify(d));
    populateSettings();
    const toast = $('saveToast');
    toast.textContent = '↺ Reset to defaults';
    toast.className = 'toast';
    setTimeout(() => { toast.textContent = ''; toast.className = ''; }, 2000);
  }

  // === Event listeners ===
  const calcTriggers = ['meters','qa','qb','sets','type'].map(id => $(id));
  calcTriggers.forEach(el => {
    if (el) el.addEventListener('input', calc);
  });
  inputFields.forEach(el => {
    if (el) el.addEventListener('input', calc);
  });

  // Set default date
  if ($('dt')) {
    const now = new Date().toISOString().split('T')[0];
    $('dt').value = now;
  }

  // Init
  populateSettings();

  // Expose functions for inline buttons
  window.saveSettings = saveSettings;
  window.resetToDefault = resetToDefault;
</script>
</body>
</html>
